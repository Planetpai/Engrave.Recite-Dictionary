plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'top.southfish.engrave'
    compileSdk 34

    defaultConfig {
        applicationId "top.southfish.engrave"
        minSdk 28
        // 29：One UI Watch 只有旧式应用（targetSdk≤29 传统存储）才会出现在
        // 设置→安全与隐私→许可管理器→文件 里，用户才能手动授予存储权限；
        // targetSdk 30+ 在手表上没有任何用户可授予的文件权限（无所有文件访问页、SAF 是空壳）
        targetSdk 29
        versionCode 4
        versionName "0.2beta.3"
    }

    buildTypes {
        release {
            minifyEnabled true
            // 侧载分发包用 debug 密钥签名：可直接覆盖手表上的旧 debug 版，免卸载保数据
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.4'
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    lint {
        // targetSdk 29 是有意保留（One UI Watch 旧式存储权限，见 defaultConfig 注释），
        // 其过期告警不应阻断 release 打包
        abortOnError false
        checkReleaseBuilds false
    }
}

ksp {
    arg('room.schemaLocation', "$projectDir/schemas")
    arg('room.incremental', 'true')
}

dependencies {
    def room_version = '2.6.1'

    // 核心层（domain/data/reminder/ViewModel）已抽出共享，
    // Wear 版与 :app-phone 共用同一套调度与数据逻辑
    implementation project(':core')

    implementation 'androidx.core:core-ktx:1.12.0'

    // Wear OS Compose
    implementation 'androidx.wear.compose:compose-material:1.2.1'
    implementation 'androidx.wear.compose:compose-foundation:1.2.1'
    implementation 'androidx.wear.compose:compose-navigation:1.2.1'

    // Compose
    implementation platform('androidx.compose:compose-bom:2023.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    // 卡片手势（pointerInput / detectDragGestures）和翻面动画（Animatable）直接依赖这两个
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.activity:activity-compose:1.8.1'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2'

    // Room
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    // DataStore：学习设置（每日新词上限等）
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
