plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'top.southfish.engrave'
    compileSdk 34

    defaultConfig {
        applicationId "top.southfish.engrave"
        minSdk 28
        // 29：One UI Watch 只有旧式应用（targetSdk≤29 传统存储）才会出现在
        // 设置→安全与隐私→许可管理器→文件 里，用户才能手动授予存储权限；
        // targetSdk 30+ 在手表上没有任何用户可授予的文件权限（无所有文件访问页、SAF 是空壳）
        targetSdk 29
        versionCode 6
        versionName "0.3beta.2"
    }

    buildFeatures { buildConfig true }

    /**
     * 翻译功能双版本：
     * - noTrans：不含 ONNX/MLKit 依赖、无「长按进翻译页」入口，体积最小 → 用于上架
     * - withTrans：含离线翻译（ONNX Marian + Google ML Kit 可选引擎）→ 仅侧载
     * 依赖只在 withTrans 挂载（见 dependencies 段），BuildConfig.WITH_TRANS 供运行时判断入口。
     */
    flavorDimensions 'trans'
    productFlavors {
        noTrans {
            dimension 'trans'
            buildConfigField "boolean", "WITH_TRANS", "false"
        }
        withTrans {
            dimension 'trans'
            buildConfigField "boolean", "WITH_TRANS", "true"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            // 侧载分发包用 debug 密钥签名：可直接覆盖手表上的旧 debug 版，免卸载保数据
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    // release 产物统一命名 Engrave-版本号-wearos-版本-abi.apk：
    // noTrans → Engrave-<v>-wearos-notrans-v7a.apk / -v8a.apk（无原生库，两包内容完全相同）
    // withTrans → Engrave-<v>-wearos-withtrans-v7a.apk / -v8a.apk
    // 两个 flavor 都带 abi 段：AGP 的 ABI 拆分是全局开关、无法只对某个 flavor 关掉，
    // 若 noTrans 不带 abi 段，v7a/v8a 两个产物会写同一个文件名，第二个必然打包失败。
    // 「检查更新」按资产名匹配本端包（见 UpdateChecker 与 AppReleaseInfo，
    // 二者都已允许 noTrans 标签带 -v7a/-v8a 尾巴）
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == 'release') {
                def abiTag = (output.getFilter(com.android.build.OutputFile.ABI) ?: "") as String
                def abiSuffix = abiTag.isEmpty() ? "" :
                    "-" + abiTag.replace("armeabi-v7a", "v7a").replace("arm64-v8a", "v8a")
                outputFileName =
                    "Engrave-${variant.versionName}-wearos-${variant.flavorName.toLowerCase()}${abiSuffix}.apk"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.4'
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    lint {
        // targetSdk 29 是有意保留（One UI Watch 旧式存储权限，见 defaultConfig 注释），
        // 其过期告警不应阻断 release 打包
        abortOnError false
        checkReleaseBuilds false
    }

    // ABI 拆分：目标手表系统 32 位、指令集支持 64 位 → withTrans 的 ONNX 原生库
    // 按 v7a/v8a 分别出包。AGP 8.2 只支持全局拆分（无 variant 级 API），
    // noTrans 无原生库，其两个 split 产物内容相同（发版只取其一）
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk false
        }
    }

    // 剔除翻译依赖里的「桌面死重」：
    // - ai.djl.huggingface:tokenizers 的 AAR 里带了 win/mac/linux 各平台原生分词库
    //   （native 目录下，单个 11MB 级）。Android 走 ai.djl.android:tokenizer-native
    //   提供的 jni 原生库（打包成 lib/<abi>/），桌面那套运行时根本用不到。
    // - JNA（DJL api 的传递依赖）在 com/sun/jna 目录下塞了各平台 dispatch 原生库；
    //   本项目 Android 分支不走 JNA。
    // 只在资源层排除（不影响 dex 里的类），noTrans 命中不了这些路径、天然无影响。
    packagingOptions {
        resources {
            excludes += ['native/**', 'com/sun/jna/**']
        }
    }
}

ksp {
    arg('room.schemaLocation', "$projectDir/schemas")
    arg('room.incremental', 'true')
}

dependencies {
    def room_version = '2.6.1'

    // 核心层（domain/data/reminder/ViewModel）已抽出共享，
    // Wear 版与 :app-phone 共用同一套调度与数据逻辑
    implementation project(':core')

    implementation 'androidx.core:core-ktx:1.12.0'

    // Wear OS Compose
    implementation 'androidx.wear.compose:compose-material:1.2.1'
    implementation 'androidx.wear.compose:compose-foundation:1.2.1'
    implementation 'androidx.wear.compose:compose-navigation:1.2.1'

    // Tile（左滑一屏的卡片）+ 表盘复杂功能（待复习数）
    implementation 'androidx.wear.tiles:tiles:1.1.0'
    implementation 'androidx.wear.watchface:watchface-complications-data-source-ktx:1.1.1'
    // TileService 的回调是 ListenableFuture，用协程桥接
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.7.3'

    // Compose
    implementation platform('androidx.compose:compose-bom:2023.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    // 卡片手势（pointerInput / detectDragGestures）和翻面动画（Animatable）直接依赖这两个
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.activity:activity-compose:1.8.1'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2'

    // Room
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    // DataStore：学习设置（每日新词上限等）
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // 离线整句翻译（仅带翻译版）：ONNX Runtime 跑 Marian 模型；Google ML Kit 为可选引擎
    // （依赖只挂 withTrans，noTrans 完全不引入，保证上架包体积）
    withTransImplementation 'com.microsoft.onnxruntime:onnxruntime-android:1.18.0'
    withTransImplementation 'com.google.mlkit:translate:17.0.2'
    // Marian 分词器：DJL 的 Java 侧读 tokenizer.json，Android 侧原生库直接走
    // System.loadLibrary("djl_tokenizer")（不依赖 JNA）。两个版本必须锁死 0.33.0——
    // tokenizer-native 在 Maven Central 只有这一个版本。单 ABI 增量：
    // arm64-v8a +8.06MB / armeabi-v7a +4.95MB（x86/x86_64 供模拟器，ABI 拆分时被剔除）
    withTransImplementation 'ai.djl.huggingface:tokenizers:0.33.0'
    withTransImplementation 'ai.djl.android:tokenizer-native:0.33.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
